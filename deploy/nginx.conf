# NLC Nginx site configuration (HTTPS)
# Install: see "Production deployment with systemd and Nginx" in the
# installation guide. Expects a certificate at /etc/nginx/ssl/nlc.crt and
# its key at /etc/nginx/ssl/nlc.key.

# WebSocket upgrade header for the console, capture and shell.
# Remove this block if your nginx.conf already defines $connection_upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP: redirect everything to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/nlc.crt;
    ssl_certificate_key /etc/nginx/ssl/nlc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -------------------------------------------------------
    # Backend API and WebSocket  (/v1/...)
    # -------------------------------------------------------
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;

        # Keep long-lived WebSocket connections (console, capture, shell) alive
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -------------------------------------------------------
    # Frontend (Next.js)
    # -------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;

        # IOU/IOL image uploads go through the frontend; match the 400 MB
        # limit in next.config.ts (Nginx defaults to 1 MB)
        client_max_body_size 400m;
    }
}
